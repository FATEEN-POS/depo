<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>قيّم الخدمة</title>
<style>
  :root {
    --bg: #0f1220;
    --card: #171b2e;
    --border: #262b45;
    --text1: #f5f6fa;
    --text2: #c7cbe0;
    --text3: #8a8fb0;
    --gold: #f0a500;
    --green: #00e676;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #1a1f38, var(--bg) 60%);
    font-family: Tahoma, Arial, sans-serif;
    color: var(--text1);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .logo-row {
    text-align: center;
    margin-bottom: 6px;
  }
  h1 {
    font-size: 19px;
    text-align: center;
    margin: 4px 0 2px;
  }
  .sub {
    text-align: center;
    color: var(--text3);
    font-size: 13px;
    margin-bottom: 22px;
  }
  .stars {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .star-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    color: #3a3f5c;
    transition: transform .15s ease, color .15s ease;
  }
  .star-btn svg { width: 38px; height: 38px; }
  .star-btn.active { color: var(--gold); transform: scale(1.12); }
  .rating-label {
    text-align: center;
    font-size: 13px;
    color: var(--text3);
    min-height: 18px;
    margin-bottom: 20px;
  }
  label.field-label {
    display: block;
    font-size: 12.5px;
    color: var(--text2);
    margin-bottom: 6px;
  }
  textarea {
    width: 100%;
    min-height: 90px;
    background: #11142400;
    background: #0c0f1c;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text1);
    font-family: inherit;
    font-size: 13.5px;
    padding: 10px 12px;
    resize: vertical;
    margin-bottom: 18px;
  }
  textarea:focus { outline: none; border-color: var(--gold); }
  button.submit-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--gold), #c98200);
    border: none;
    color: #1a1200;
    font-weight: 800;
    font-size: 14.5px;
    padding: 13px;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  button.submit-btn:disabled { opacity: .5; cursor: not-allowed; }
  .hint {
    text-align: center;
    font-size: 11px;
    color: var(--text3);
    margin-top: 14px;
    line-height: 1.6;
  }
  .done-wrap { text-align: center; padding: 10px 0; }
  .done-wrap .big-check { color: var(--green); margin-bottom: 10px; }
  .done-wrap .big-check svg { width: 54px; height: 54px; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="logo-row">💬</div>
    <h1 id="title-company">قيّم خدمتنا معاك</h1>
    <div class="sub" id="sub-service">إحنا سعداء نسمع رأيك</div>

    <div id="form-wrap">
      <div class="stars" id="stars-wrap"></div>
      <div class="rating-label" id="rating-label">اختار تقييمك</div>

      <label class="field-label">تحب تضيف تعليق؟ (اختياري)</label>
      <textarea id="comment" placeholder="اكتب رأيك في الخدمة..."></textarea>

      <button class="submit-btn" id="submit-btn" onclick="submitRating()" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.46 1.32 4.96L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2z"/></svg>
        إرسال التقييم عبر واتساب
      </button>
      <div class="hint">هيتفتحلك واتساب برسالة جاهزة — تأكيدك بالإرسال هو اللي بيوصّل تقييمك لينا</div>
    </div>

    <div id="done-wrap" class="done-wrap" style="display:none">
      <div class="big-check">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22,4 12,14.01 9,11.01"/></svg>
      </div>
      <div style="font-weight:800;font-size:15px;margin-bottom:6px">شكراً لتقييمك 🌹</div>
      <div style="font-size:12.5px;color:var(--text3)">لو مفتحش واتساب تلقائي، دوس هنا:</div>
      <div style="margin-top:10px"><a id="manual-link" href="#" target="_blank" style="color:var(--gold);font-size:13px">فتح واتساب يدويًا</a></div>
    </div>
  </div>

<script>
  const STAR_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>';
  const LABELS = {1:'مش راضي خالص 😞', 2:'ممكن أحسن 🙁', 3:'كويس 🙂', 4:'حلو جدًا 😃', 5:'ممتاز! 🤩'};

  const params = new URLSearchParams(location.search);
  const company = params.get('company') || '';
  const phone = (params.get('phone') || '').replace(/[^0-9]/g, '');
  const client = params.get('client') || '';
  const service = params.get('service') || '';

  document.getElementById('title-company').textContent = company ? `قيّم خدمتك من ${company}` : 'قيّم خدمتنا معاك';
  document.getElementById('sub-service').textContent = service ? `بخصوص: ${service}` : 'إحنا سعداء نسمع رأيك';

  let rating = 0;
  const starsWrap = document.getElementById('stars-wrap');
  for (let i = 1; i <= 5; i++) {
    const btn = document.createElement('button');
    btn.className = 'star-btn';
    btn.type = 'button';
    btn.innerHTML = STAR_SVG;
    btn.onclick = () => setRating(i);
    starsWrap.appendChild(btn);
  }
  function setRating(v) {
    rating = v;
    [...starsWrap.children].forEach((b, idx) => b.classList.toggle('active', idx < v));
    document.getElementById('rating-label').textContent = LABELS[v] || '';
    document.getElementById('submit-btn').disabled = false;
  }

  function submitRating() {
    if (!rating) return;
    if (!phone) {
      alert('الرابط ده ناقصه رقم شركة يستقبل التقييم — كلّم الشركة عشان تصلحه.');
      return;
    }
    const comment = document.getElementById('comment').value.trim();
    const stars = '⭐'.repeat(rating);
    let text = `تقييم خدمة جديد\n`;
    if (client) text += `العميل: ${client}\n`;
    if (service) text += `الخدمة: ${service}\n`;
    text += `التقييم: ${stars} (${rating}/5)\n`;
    if (comment) text += `تعليق العميل: ${comment}`;

    const url = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
    document.getElementById('manual-link').href = url;
    document.getElementById('form-wrap').style.display = 'none';
    document.getElementById('done-wrap').style.display = 'block';
    window.open(url, '_blank');
  }
</script>
</body>
</html>
